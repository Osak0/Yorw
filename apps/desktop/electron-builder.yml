appId: com.yorw.desktop
productName: Yorw
directories:
  output: ../../release/desktop
files:
  - out/**
  - package.json
extraResources:
  - from: ../../services/api/dist/yorw-api
    to: backend/yorw-api
  - from: ../../docs/user-guide.md
    to: help/user-guide.md
  - from: ../../docs/known-limitations.md
    to: help/known-limitations.md
  - from: ../../docs/review-feedback.md
    to: help/review-feedback.md
  - from: ../../docs/qa/v0.2.0-retrieval-cases.md
    to: help/qa/v0.2.0-retrieval-cases.md
  - from: ../../docs/releases/v0.2.0.md
    to: help/releases/v0.2.0.md
win:
  target: nsis
  artifactName: Yorw-Setup-${version}-${arch}.${ext}
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
